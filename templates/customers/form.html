{% extends "layout.html" %}{% block title %}New customer{% endblock %}{% block heading %}Add customer{% endblock %}{% block section %}Customer records{% endblock %}{% block subtitle %}Create a customer profile for orders and invoices.{% endblock %}
{% block content %}<section class="panel" style="max-width:850px"><form method="post"><div class="row g-3"><div class="col-12"><label class="form-label">Customer / organisation name *</label><input required maxlength="180" class="form-control" name="name" value="{{ form.get('name','') }}"></div><div class="col-md-6"><label class="form-label">Email address</label><input type="email" class="form-control" name="email" value="{{ form.get('email','') }}"></div><div class="col-md-6"><label class="form-label">Phone</label><input class="form-control" name="phone" value="{{ form.get('phone','') }}"></div><div class="col-12"><label class="form-label">Address</label><textarea class="form-control" name="address" rows="3">{{ form.get('address','') }}</textarea></div></div><div class="d-flex gap-2 mt-4"><button class="btn btn-primary">Save customer</button><a href="{{ url_for('customers') }}" class="btn btn-light">Cancel</a></div></form></section>{% endblock %}
